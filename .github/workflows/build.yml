name: build

on:
  push:
    branches: [ ps5 ]
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: Install Software
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends fuse git python3 wget zip

      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Create build container image
        run: ./drun.sh echo done

      - name: Build
        run: ./drun.sh ./scripts/ci_build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ps5-sdl2_release
          path: build-ps5/ps5-sdl2_release/
